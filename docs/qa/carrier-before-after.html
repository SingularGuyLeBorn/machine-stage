<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #10161c; color: #dbe6ee; font-family: "Microsoft YaHei", sans-serif; }
      .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 18px 12px; }
      figure { margin: 0; background: #0b1116; border: 1px solid #26333d; border-radius: 8px; overflow: hidden; }
      img { display: block; width: 100%; height: 720px; object-fit: cover; object-position: center; }
      figcaption { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 18px; letter-spacing: .04em; }
      .before { color: #e0a06a; }
      .after { color: #7fd8b0; }
      .note { padding: 0 20px 16px; font-size: 13px; color: #8fa1ae; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <figure>
        <img src="carrier-fujian-side-full.jpeg" alt="before" />
        <figcaption><span class="before">改前 · 直壁挤出的浮筒轮廓</span><span>2026-10-22</span></figcaption>
      </figure>
      <figure>
        <img src="carrier-home.jpeg" alt="after" />
        <figcaption><span class="after">改后 · 56 站型线放样 + 斜角甲板 + 海态</span><span>2026-10-23</span></figcaption>
      </figure>
    </div>
    <div class="note">同一套 1:8 编辑数据 / presentationScale 7.9（世界 1 单位 = 1 米）。改后视角为复位后的 3/4 全舰视图；舷侧外飘、前倾艏柱、巡洋舰艉与水下红漆壳体均在放样中生成。</div>
  </body>
</html>
